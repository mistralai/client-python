name: Linting Python custom files

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [ciclone, 4x8gi-x86]

    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install PortAudio (pyaudio build dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends portaudio19-dev

      - name: Install dependencies
        run: |
          uv sync --all-extras

      # The init, sdkhooks.py and types.py files in the _hooks folders are generated by Speakeasy hence the exclusion
      - name: Run all linters
        run: scripts/lint_custom_code.sh

  lint_custom_code_required:
    runs-on: [ciclone, 1x1gi-x86]
    needs: lint
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

    steps:
      - name: Require custom code lint to pass
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Expected custom code lint to pass, got: ${{ needs.lint.result }}"
            exit 1
          fi
