                - location: ../openapi/specs/v2/azure-sdk.yaml
        mistral-google-cloud-source:
            inputs:
                - location: ../openapi/specs/v2/google-cloud-sdk.yaml
        mistral-openapi:
            inputs:
                - location: ../openapi/specs/v2/main-sdk.yaml
            overlays:
