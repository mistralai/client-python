version: 2
# The generated clients carry every team's spec changes, so any spec-owning team
# may approve a regen: CODEOWNERS is satisfied by one owner, so this widens who
# can approve without adding a second required approval. open-pr.sh drops the
# auto-requested reviewers whose specs the regen does not carry, so a regen only
# notifies the teams actually in it.
#
# This is every team owning a source in SOURCES_DEFS in openapi/main.py, which
# is what compiles into these clients, plus the overlays that shape them. Keep
# it in step: a team missing here is auto-requested on nothing and cannot
# satisfy the code-owner review on a regen carrying its own operations.
defaults:
  owners: ['@mistralai/engineering-ai-registry', '@mistralai/engineering-sdk', '@mistralai/engineering-audio-ocr', '@mistralai/engineering-billing', '@mistralai/engineering-connectors-platform', '@mistralai/engineering-context', '@mistralai/engineering-identity-access-management', '@mistralai/engineering-inference', '@mistralai/engineering-observability', '@mistralai/engineering-workflows']
  blocking: true
rules:
  # The widening above is for generated output. These are the hand-written paths,
  # taken from each client's .genignore, and a spec team has no more claim on them
  # than on any other code here. Last match wins, so they stay with us.
  #
  # Keep a regen inside one rule. GitHub asks for one approval per matched rule,
  # so a regen touching both this set and the generated one needs two: a spec
  # team's, and then ours. Nothing below may be a path a regen writes.
  - 'examples/': '@mistralai/engineering-ai-registry'
  - 'utils/': '@mistralai/engineering-ai-registry'
  - 'scripts/': '@mistralai/engineering-ai-registry'
  - 'src/mistralai/extra/': '@mistralai/engineering-ai-registry'
  - 'src/mistralai/extra/voice_agents/': '@mistralai/engineering-audio-ocr'
  - 'src/mistralai/extra/tests/voice_agents/': '@mistralai/engineering-audio-ocr'
  - 'examples/audio/voice_agents/': '@mistralai/engineering-audio-ocr'
